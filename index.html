<!doctype html>
<!--
  GitHub Pages publishes this repository from its root, so that the docs site
  can reach the framework it documents: docs/index.html asks for
  ../src/webterm.css, which is this directory's src/webterm.css.

  That makes the root of the site this file rather than the docs. It carries no
  stylesheet and no script on purpose — a redirect that depends on the thing it
  redirects to is a redirect that can fail twice.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=docs/">
<title>webterm</title>
</head>
<body>
<p>webterm &mdash; a CSS framework on a character cell grid. The documentation is at <a href="docs/">docs/</a>.</p>
</body>
</html>
